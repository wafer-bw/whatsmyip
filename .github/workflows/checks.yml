name: checks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  setup:
    name: setup
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go mod download

  clean:
    name: clean
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: setup
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go mod tidy && git diff --exit-code
      - run: go mod verify
      - run: go vet ./...
      - run: go fix ./... && git diff --exit-code
      - run: go fmt ./... && git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: clean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: clean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go test -shuffle=on -v -count=1 -race -failfast -timeout=30s -covermode=atomic ./...

  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: clean
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go test -v -shuffle=on -run=- -bench=. -benchtime=1x -timeout=1m ./...

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - lint
      - test
      - benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: 'go.mod', cache: true }
      - run: go generate ./... && git diff --exit-code
      - run: go build -o /dev/null ./...

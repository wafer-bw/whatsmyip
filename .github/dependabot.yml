version: 2

updates:

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "yearly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    target-branch: "master"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "yearly"
    target-branch: "master"
    groups:
      all-dependencies:
        patterns:
          - "*"
